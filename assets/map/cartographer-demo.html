<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cartographer map demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600&family=Instrument+Serif:ital@1&display=swap">
<style>
  body { margin: 0; background: #16213a; min-height: 100vh; display: grid; place-items: center; }
  #map { width: min(1200px, 96vw); }
  #map svg { width: 100%; height: auto; display: block; overflow: visible; }
</style></head><body>
<div id="map"></div>
<script>
  // Inline the SVG so its CSS and hover work; the cartouche names the continent under the pointer.
  fetch("world-cartographer.svg").then(r => r.text()).then(t => {
    map.innerHTML = t;
    var title = document.getElementById("carto-title"), sub = document.getElementById("carto-sub");
    document.querySelectorAll(".continent").forEach(p => {
      // hand the fill to hover once this continent's intro animation has finished
      p.addEventListener("animationend", e => { if (e.animationName === "wash") p.classList.add("ready"); });
      p.addEventListener("mouseenter", () => { title.textContent = p.dataset.name.toUpperCase(); sub.textContent = "Hover to explore"; });
      p.addEventListener("mouseleave", () => { title.textContent = "MAPPA MUNDI"; sub.textContent = "Where the lanterns are lit"; });
    });
  });
</script></body></html>
