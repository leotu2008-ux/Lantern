<meta charset="utf-8">
<title>Lantern Globe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Jost:wght@300;400&display=swap">
<style>
  :root { --bg: #16213a; --amber: #F2B36A; color-scheme: dark; }
  html, body { margin: 0; background: var(--bg); color: #e9e9e4; font-family: Jost, sans-serif; }
  .track { height: 400vh; }
  main { position: sticky; top: 0; height: 100vh; box-sizing: border-box; min-height: 0; display: grid; grid-template-columns: min(760px, 100%); justify-content: center; align-content: center; gap: 14px; padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  #label { color: var(--amber); font: 600 14px "Josefin Sans", sans-serif; letter-spacing: .4em; text-transform: uppercase; min-height: 1.2em; }
  .legend { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; opacity: .7; display: flex; gap: 18px; }
  .legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); margin-right: 6px; box-shadow: 0 0 6px var(--amber); }
  .legend b { display: inline-block; width: 18px; height: 1px; background: var(--amber); vertical-align: middle; margin-right: 6px; }
  canvas { width: min(100%, calc(100vh - 130px)); justify-self: center; aspect-ratio: 1; display: block; cursor: grab; touch-action: pan-y; }
  p { margin: 0; font-size: 12px; font-weight: 300; opacity: .5; }
</style>
<div class="track"><main>
  <header><div id="label">Scroll to turn · hover a continent</div>
    <div class="legend"><span><i></i>Lantern city</span><span><b></b>Network link</span></div></header>
  <canvas id="globe" aria-label="A spinning globe in a topographic style, showing Lantern's cities and the links between them" role="img"></canvas>
  <p>Stylised contours (generated, not real elevation). Coastlines from Natural Earth.</p>
</main></div>
<script src="globe.bundle.js"></script>
