<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Renaissance LinkedIn banners</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Jost:wght@400&family=Instrument+Serif:ital@0;1&display=swap">
<style>
  /* Two LinkedIn banners in the site's Renaissance style: Florence at sunrise from the bridge painting,
     the landing's angel carrying the lantern above it, a gilt frame line and a fine paint grain.
     .personal is 1584 x 396 (profile; the photo covers the bottom-left), .company is 1128 x 191 (company page). */
  html, body { margin: 0; background: #1a140f; }
  body { display: grid; gap: 40px; padding: 40px; justify-items: start; }
  :root { --ivory: #F6F1E7; --red: #C33029; --gold: rgba(214, 178, 112, .8); }
  .banner { position: relative; overflow: hidden; color: var(--ivory); background: #2a1f18; }
  .personal { width: 1584px; height: 396px; }
  .company { width: 1128px; height: 191px; }

  /* the painting */
  .city { position: absolute; inset: 0; background: url(../assets/city/descent-1920.webp) no-repeat; }
  .personal .city { background-size: 1920px auto; background-position: -150px -1085px; }
  .company .city { background-size: 1440px auto; background-position: -170px -860px; }
  /* sfumato: deepen the far right where the words sit, keep the sunrise and the Duomo bright */
  .shade { position: absolute; inset: 0; background:
      linear-gradient(to right, rgba(24,16,10,0) 50%, rgba(24,16,10,.28) 72%, rgba(24,16,10,.42) 100%),
      linear-gradient(to bottom, rgba(24,16,10,.12), rgba(24,16,10,0) 30%, rgba(24,16,10,0) 75%, rgba(24,16,10,.22)); }
  .grain { position: absolute; inset: 0; background: url(paint-grain.jpg) 0 0 / 256px 256px; mix-blend-mode: overlay; opacity: .16; pointer-events: none; }
  .vignette { position: absolute; inset: 0; box-shadow: inset 0 0 90px 10px rgba(20,12,6,.42); pointer-events: none; }
  /* a gilt frame line, inset like the edge of a panel painting */
  .frame { position: absolute; inset: 14px; border: 1px solid var(--gold); pointer-events: none; }
  .frame::after { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(214,178,112,.35); }
  .company .frame { inset: 9px; } .company .frame::after { inset: 4px; }

  /* the angel and her lantern, from the landing's layers */
  .angel { position: absolute; pointer-events: none; -webkit-mask-image: linear-gradient(to right, transparent 0, #000 70px); mask-image: linear-gradient(to right, transparent 0, #000 70px); }
  .angel img { position: absolute; max-width: none; }
  .personal .angel { left: 520px; top: -8px; width: 340px; height: 300px; }
  .personal .angel .a { left: 0; top: 0; width: 200px; height: 241.5px; }
  .personal .angel .g { left: 54px; top: 80px; width: 196px; height: 196px; opacity: .95; }
  .personal .angel .l { left: 124.5px; top: 127.3px; width: 54.8px; height: 116.3px; }
  .company .angel { left: 380px; top: -6px; width: 200px; height: 191px; }
  .company .angel .a { left: 0; top: 0; width: 110px; height: 132.8px; }
  .company .angel .g { left: 29.7px; top: 44px; width: 107.8px; height: 107.8px; opacity: .95; }
  .company .angel .l { left: 68.5px; top: 70px; width: 30.1px; height: 64px; }

  /* the words */
  .text { position: absolute; top: 50%; translate: 0 -50%; text-align: right; display: grid; justify-items: end; text-shadow: 0 1px 18px rgba(20,12,6,.55); }
  .personal .text { right: 84px; gap: 14px; }
  .company .text { right: 50px; gap: 8px; }
  .mark { font: 700 64px/1 "Josefin Sans", sans-serif; letter-spacing: .38em; margin-right: -.38em; }
  .company .mark { font-size: 34px; }
  .rule { width: 140px; height: 2px; background: linear-gradient(to left, var(--red), rgba(195,48,41,0)); }
  .company .rule { width: 80px; }
  .motto { font: italic 400 30px/1 "Instrument Serif", serif; color: rgba(246,236,220,.82); }
  .motto b { font-weight: 400; color: #fff4e4; }
  .company .motto { font-size: 19px; }
  .line { font: 600 14px/1.2 "Josefin Sans", sans-serif; letter-spacing: .3em; margin-right: -.3em; text-transform: uppercase; opacity: .9; }
  .company .line { font-size: 10px; letter-spacing: .28em; margin-right: -.28em; }
</style>
</head>
<body>

<div class="banner personal" id="personal">
  <div class="city"></div>
  <div class="angel"><img class="a" src="../assets/motion/angel.webp" alt=""><img class="g" src="../assets/motion/glow.webp" alt=""><img class="l" src="../assets/motion/lantern.webp" alt=""></div>
  <div class="shade"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="text">
    <div class="mark">LANTERN</div>
    <div class="rule"></div>
    <div class="motto"><b>Lux in tenebris.</b> Light in the dark.</div>
    <div class="line">Angel capital · Fund 00 · Spring ’27</div>
  </div>
  <div class="frame"></div>
</div>

<div class="banner company" id="company">
  <div class="city"></div>
  <div class="angel"><img class="a" src="../assets/motion/angel.webp" alt=""><img class="g" src="../assets/motion/glow.webp" alt=""><img class="l" src="../assets/motion/lantern.webp" alt=""></div>
  <div class="shade"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="text">
    <div class="mark">LANTERN</div>
    <div class="rule"></div>
    <div class="motto"><b>Lux in tenebris.</b> Light in the dark.</div>
    <div class="line">Angel capital · Fund 00</div>
  </div>
  <div class="frame"></div>
</div>

</body>
</html>
